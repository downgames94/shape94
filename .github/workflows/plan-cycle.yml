name: Verificar ciclos de 120 dias
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Criar propostas de atualização vencidas
        run: npm run cycle
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
